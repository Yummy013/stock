    var nameCode = (r.name || '—') + '<span class="col-code-inline"> (' + (r.code || '') + ')</span>';
    var turn = r.turnover_oku;
    var turnStr = turn == null ? '—' : turn >= 100 ? turn.toFixed(0) + '億' : turn >= 1 ? turn.toFixed(1) + '億' : (turn * 100).toFixed(0) + '百万';
    var tc = r.turnover_change_pct;
    var tcStr = tc == null ? '' : (tc >= 0 ? '+' : '') + tc.toFixed(1) + '%';
    var tcCls = tc == null ? '' : tc > 0 ? 'pct-up' : tc < 0 ? 'pct-dn' : '';
    var turnCombo = turnStr + (tcStr ? '<span class="turn-chg ' + tcCls + '"> (' + tcStr + ')</span>' : '');
    return '<tr>' +
      '<td class="col-rank">' + r.rank + '</td>' +
      '<td>' + nameCode + '</td>' +
      '<td class="col-pct ' + pctCls + '">' + pctStr + '</td>' +
      '<td class="col-turn-combo">' + turnCombo + '</td>' +
      '</tr>';
  }).join('') + '</tbody>';
  return '<div class="mkt-tbl-wrap"><table class="mkt-tbl">' + header + body + '</table></div>';
}

function renderMarketTable(tabId) {
  var rows = _marketTables[tabId];
  if (!rows) return;
  var el = document.getElementById(tabId + '_table');
  if (!el || el._rendered) return;
  el.innerHTML = buildMarketTableHTML(rows);
  el._rendered = true;
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  renderTab(id);
  renderMarketTable(id);
}

var _historyData = {};
var _activeTabId = 'tab_morning';
var _activeTabBtn = null;

function fmtTurnover(v) {
  if (v == null) return '—';
  if (v >= 1e12) return (v/1e12).toFixed(2) + '兆円';
  if (v >= 1e8)  return (v/1e8).toFixed(1) + '億円';
  return (v/1e4).toFixed(0) + '万円';
}

function renderHistTable(key) {
  var data = _historyData[key];
  var tbody = document.getElementById('hist-tbody');
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:20px">データなし</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(row) {
    var sym = (row.symbol || '').replace('.T', '');
    var pct = row.pct_change;
    var pctStr = pct == null ? '—' : (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
    var pctCls = pct == null ? '' : pct > 0 ? 'pct-up' : pct < 0 ? 'pct-dn' : '';
    var close = row.last_close == null ? '—' : row.last_close.toLocaleString('ja-JP') + '円';
    return '<tr>' +
      '<td style="color:#999;font-size:12px">' + row.rank + '</td>' +
      '<td>' + (row.name || '—') + '</td>' +
      '<td style="color:#1a7aad;font-size:12px">' + sym + '</td>' +
      '<td style="text-align:right">' + fmtTurnover(row.turnover) + '</td>' +
      '<td class="hist-col-close" style="text-align:right;color:#666">' + close + '</td>' +
      '<td style="text-align:right" class="' + pctCls + '">' + pctStr + '</td>' +
    '</tr>';
  }).join('');
}

function onDateChange(val) {
  if (val === 'today') {
    document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
    document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
    document.getElementById('tab-bar').style.display = 'flex';
    document.getElementById('history-view').style.display = 'none';
    document.getElementById(_activeTabId).classList.add('active');
    if (_activeTabBtn) _activeTabBtn.classList.add('active');
    renderTab(_activeTabId);
  } else {
    var base = location.protocol === 'file:' ? 'http://localhost:8081' : '';
    location.href = base + '/hist/' + val;
  }
}

document.addEventListener('DOMContentLoaded', function() {
  _activeTabBtn = document.querySelector('.tab-btn.active');
  renderTab('tab_morning');
  renderMarketTable('tab_morning');
});

(function() {
  var nextRefresh = "";
  if (!nextRefresh) {
    document.getElementById('refresh-box').style.display = 'none';
    return;
  }
  var target = new Date(nextRefresh);
  var cd = document.getElementById('countdown');
  function tick() {
    var diff = Math.floor((target - new Date()) / 1000);
    if (diff <= 0) { location.reload(); return; }
    var m = Math.floor(diff / 60), s = diff % 60;
    if (cd) cd.textContent = m + ':' + String(s).padStart(2, '0');
    setTimeout(tick, 1000);
  }
  tick();
})();

(function() {
  var BUILD_TIME = "2026-07-18 12:05";
  function checkUpdate() {
    fetch(location.href, {cache: 'no-store'})
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var m = html.match(/var BUILD_TIME = "([^"]+)"/);
        if (m && m[1] !== BUILD_TIME) { location.reload(); }
      })
      .catch(function() {});
  }
  setInterval(checkUpdate, 60000);
})();
</script>
